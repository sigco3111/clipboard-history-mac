name: Build macOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (Debug)
        run: |
          swift build \
            --configuration debug \
            --arch $(uname -m)

      - name: Build (Release)
        run: |
          swift build \
            --configuration release \
            --arch $(uname -m)

      - name: Locate built executable
        id: find-exe
        run: |
          EXE_PATH=$(swift build --configuration release --show-bin-path)/ClipboardHistoryMac
          echo "exe_path=$EXE_PATH" >> $GITHUB_OUTPUT
          ls -la "$EXE_PATH"
          file "$EXE_PATH"

      - name: Create .app bundle structure
        run: |
          APP_DIR="ClipboardHistoryMac.app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          EXE_PATH=$(swift build --configuration release --show-bin-path)/ClipboardHistoryMac
          cp "$EXE_PATH" "$APP_DIR/Contents/MacOS/ClipboardHistoryMac"
          cp Sources/ClipboardHistoryMac/Info.plist "$APP_DIR/Contents/Info.plist"
          cp Sources/ClipboardHistoryMac/ClipboardHistory.entitlements "$APP_DIR/Contents/Resources/" 2>/dev/null || true
          chmod +x "$APP_DIR/Contents/MacOS/ClipboardHistoryMac"

      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - ClipboardHistoryMac.app
          codesign --verify --verbose ClipboardHistoryMac.app

      - name: Package as zip
        run: |
          zip -r ClipboardHistoryMac-${{ matrix.os }}.zip ClipboardHistoryMac.app

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardHistoryMac-${{ matrix.os }}
          path: ClipboardHistoryMac-${{ matrix.os }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false