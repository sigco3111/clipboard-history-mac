name: Build macOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build (Debug)
        run: |
          xcodebuild \
            -scheme ClipboardHistoryMac \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build (Release)
        run: |
          xcodebuild \
            -scheme ClipboardHistoryMac \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath build-release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find .app
        id: find-app
        run: |
          APP_PATH=$(find build-release -name "ClipboardHistoryMac.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          ls -la "$APP_PATH"

      - name: Package .app as DMG
        if: matrix.os == 'macos-14'
        run: |
          cd build-release
          APP_PATH=$(find . -name "ClipboardHistoryMac.app" -type d | head -1)
          # DMG 생성 (선택적)
          mkdir -p dmg-staging
          cp -R "$APP_PATH" dmg-staging/
          hdiutil create -volname "ClipboardHistoryMac" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            ClipboardHistoryMac-${{ github.sha }}.dmg || echo "DMG creation skipped"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardHistoryMac-${{ matrix.os }}
          path: ${{ steps.find-app.outputs.app_path }}.zip
          if-no-files-found: warn

      - name: Upload DMG (macos-14 only)
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardHistoryMac-DMG-${{ matrix.os }}
          path: build-release/ClipboardHistoryMac-*.dmg
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false